<style>
  :root{--navy:#0a1628;--navy2:#0f1e36;--gold:#c9a14a;--goldl:#d4b15c;--cream:#f5efe1;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--navy);color:var(--cream);
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + .5rem) .9rem calc(env(safe-area-inset-bottom) + .6rem);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:400px;border:1px solid rgba(201,161,74,.55);
    border-radius:4px;padding:1.3rem 1.2rem 1.2rem;text-align:center;
    background:linear-gradient(180deg,var(--navy),var(--navy2));
  }
  .photo{
    width:104px;height:104px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold);display:block;margin:0 auto .9rem;
  }
  .eyebrow{
    font-size:.7rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    color:var(--gold);margin-bottom:.6rem;
  }
  h1{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:1.5rem;line-height:1.15;color:var(--cream);margin-bottom:.15rem;
  }
  .sub{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
    font-size:1.35rem;line-height:1.2;color:var(--goldl);margin-bottom:1rem;
  }
  .qr{width:58%;max-width:210px;border-radius:12px;display:block;margin:0 auto .85rem;}
  .label{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:.25rem;}
  .url{font-size:.85rem;font-weight:700;color:var(--gold);word-break:break-all;}
  .brand-mark{height:56px;width:auto;display:block;margin:0 auto 1.1rem}
    .btn{
    display:block;width:100%;padding:.8rem;border-radius:3px;
    border:1px solid var(--gold);color:var(--cream);font-weight:600;font-size:.94rem;
    text-decoration:none;transition:background .2s;
  }
  .btn:active{background:rgba(201,161,74,.12);}
  .btn.solid{background:var(--gold);color:var(--navy);margin-bottom:.55rem;}

  .scan-offer{font-size:12px;line-height:1.55;margin:14px 0 0;opacity:.75;text-align:center}
  .scan-offer a{color:#c9a14a;text-decoration:none}
